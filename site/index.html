<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300b050' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8'/><path d='M12 18V6'/></svg>">
    <title>MOTIVATE HOME</title>
    <link rel="stylesheet" href="css/motivate.css">
    <style>
        .page .style-one { font-size: 5rem; font-family: 'Arial Black', sans-serif; color: #083a5e; font-weight: normal; }
        .page .style-two { font-size: 2rem; font-family: 'Arial Black', sans-serif; color: #0070c0; font-weight: normal; }
        .page .style-three { font-size: 1rem; font-family: Arial, sans-serif; color: #FFFFFF; font-weight: normal; }

        /* 4 boxes per row: rounded, short and wide, black text */
        .tile-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0.7rem 1.4rem;
            width: min(100%, 72rem);
        }
        .tile {
            display: block;
            padding: 0.45rem 1rem;
            border: 2px solid #000000;
            border-radius: 0.6rem;
            background: #ffffff;
            color: #000000;
            font-family: Arial, sans-serif;
            font-size: 1.35rem;
            text-align: center;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.15s ease;
        }
        .tile:hover { background: #f0f0f0; }
        .tile:focus-visible { outline: 2px solid #0070c0; outline-offset: 3px; }

        @media (max-width: 700px) {
            .tile-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
        @media (prefers-reduced-motion: reduce) {
            .tile { transition: none; }
        }
    </style>
</head>
<body data-page="0">

    <!-- ============================ INDEX - HOME ============================ -->
    <main class="page">
        <div class="sub-section" style="gap: 1rem; width: 100%;">
            <div class="style-one">MOTIVATE</div>
            <div class="style-two">BE PATIENT - FOCUSED AND DISCIPLINED</div>
            <div class="style-three">&nbsp;</div>
            <nav class="tile-grid" id="tileGrid" aria-label="Pages"></nav>
            <div class="style-three">&nbsp;</div>
        </div>
    </main>

    <script src="js/nav.js"></script>
    <script>
        // One box per page ("1 - KEY POINTS"), built from the shared page list in nav.js.
        (function () {
            const grid = document.getElementById('tileGrid');
            window.MOTIVATE_PAGES.filter(function (p) { return p.id !== '0'; }).forEach(function (p) {
                const a = document.createElement('a');
                a.className = 'tile';
                a.href = p.file;
                a.textContent = p.id + ' - ' + p.label.toUpperCase();
                a.title = a.textContent;
                grid.appendChild(a);
            });
        })();
    </script>
</body>
</html>
