<!DOCTYPE html>
<!-- MOTIVATE info page (opened by the "I" circle, bottom right of every page).
     GENERATED from assets\MOTIVATE_info_page.docx by app\info_page.py (template: app\info_template.html).
     Edit the Word file, not this page: the next click on I (or MOTIVATE start) rebuilds it.
     White full page, black Arial 16 pt text, 18 pt bold titles, full window width.
     Scroll: mouse wheel, scroll bar, arrow keys, Page Up/Down, Home, End, Space. Any other key or a click closes it. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOTIVATE INFO</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300b050' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='10'/><path d='M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8'/><path d='M12 18V6'/></svg>">
    <style>
        html, body { margin: 0; background: #ffffff; overflow-x: hidden; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16pt;
            line-height: 1.15;
            color: #000000;
            text-align: left;
            cursor: default;
        }
        main { padding: 0.75in; }
        h1, h2, h3 { font-size: 18pt; font-weight: bold; margin: 0 0 1.15em 0; }
        h3 { font-size: 16pt; margin-bottom: 0; }
        p, ul, ol { margin: 0 0 1.15em 0; }
        p, li { overflow-wrap: anywhere; }   /* full window width; wraps only at the window edge (no sideways scroll) */
        ul, ol { padding-left: 1.6em; }
        li + li { margin-top: 0.3em; }
        code { font-family: Arial, Helvetica, sans-serif; font-weight: bold; }
        .close-hint { font-size: 14pt; color: #000000; }
        @media (max-width: 600px) { main { padding: 0.5in 16px; } }
    </style>
</head>
<body>
    <main>
<!-- INFO-BODY -->
    </main>
    <script>
        (function () {
            'use strict';
            const SCROLL_KEYS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End', ' ',
                'Shift', 'Control', 'Alt', 'Meta'];

            function close() {
                if (history.length === 1) {                           // its own tab (opened from the builder)
                    window.close();
                    setTimeout(function () { location.href = 'index.html'; }, 200);   // if the browser refuses
                } else if (document.referrer) {
                    history.back();
                } else {
                    location.href = 'index.html';
                }
            }

            document.addEventListener('keydown', function (e) {
                if (SCROLL_KEYS.indexOf(e.key) === -1 && !e.ctrlKey && !e.metaKey) close();
            });
            document.addEventListener('click', function () {
                if (!String(window.getSelection())) close();         // selecting text does not close
            });
        })();
    </script>
</body>
</html>
